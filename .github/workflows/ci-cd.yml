name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_fiscal_data
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # Test environment variables
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_fiscal_data
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_fiscal_data
      TG_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ"
      ADMIN_ID: "123456789"
      DAILY_REQUEST_LIMIT: "50"
      LOG_RETENTION_DAYS: "7"
      # ChromeDriver settings
      WDM_LOG_LEVEL: 0
      WDM_LOCAL: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Chrome
      run: |
        # Install Chrome only
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

        # Verify Chrome installation
        google-chrome --version

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install -r requirements.txt
        pip install -r tests/requirements-test.txt
        # Update webdriver-manager to latest version for new API support
        pip install --upgrade webdriver-manager

    - name: Auto-format code
      run: |
        # Автоматически исправляем форматирование
        black --line-length=120 src/ tests/
        isort --profile=black --line-length=120 src/ tests/
        autoflake --in-place --remove-all-unused-imports --remove-duplicate-keys --remove-unused-variables --recursive src/ tests/

    - name: Run linting (relaxed)
      run: |
        # Более мягкий линтинг, игнорируем некоторые правила
        flake8 src/ tests/ \
          --max-line-length=1000 \
          --extend-ignore=E203,E402,E722,F841,F541,W291 \
          --exclude=migrations \
          --statistics
      continue-on-error: true

    - name: Wait for PostgreSQL to be ready
      run: |
        timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'

    - name: Initialize database
      run: |
        cd src
        python -c "
        import os
        os.environ.update({
            'POSTGRES_HOST': 'localhost',
            'POSTGRES_PORT': '5432',
            'POSTGRES_DB': 'test_fiscal_data',
            'POSTGRES_USER': 'test_user',
            'POSTGRES_PASSWORD': 'test_password'
        })
        from db.database import db_manager
        db_manager.init_database()
        print('Database initialized successfully')
        "

    - name: Run tests
      run: |
        # Отключаем pytest-postgresql (требует pkg_resources); в CI используем сервис PostgreSQL из workflow
        pytest tests/ \
          -p no:pytest_postgresql \
          --cov=src \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          -v \
          --tb=short

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # needs: test  # раскомментируйте, когда снова включите job test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      env:
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        set -e
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        # ssh-agent не переживает между шагами: ключ с паролем и ssh должны быть в одном run
        if [ -n "$DEPLOY_SSH_KEY_PASSPHRASE" ]; then
          eval "$(ssh-agent -s)"
          echo '#!/bin/sh' > /tmp/askpass.sh
          echo 'echo "$DEPLOY_SSH_KEY_PASSPHRASE"' >> /tmp/askpass.sh
          chmod +x /tmp/askpass.sh
          export SSH_ASKPASS=/tmp/askpass.sh
          export DISPLAY=:0
          ssh-add ~/.ssh/id_rsa
        fi
        ssh-keyscan -H "$DEPLOY_HOST" -p "$DEPLOY_SSH_PORT" >> ~/.ssh/known_hosts
        # Без sk-* (FIDO): иначе старый sshd на сервере пишет "no matching host key type"
        SSH_OPTS=(
          -i ~/.ssh/id_rsa
          -p "$DEPLOY_SSH_PORT"
          -o ConnectTimeout=15
          -o StrictHostKeyChecking=yes
          -o HostKeyAlgorithms=ssh-ed25519,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,rsa-sha2-512,rsa-sha2-256
          -o PubkeyAcceptedAlgorithms=ssh-ed25519,rsa-sha2-512,rsa-sha2-256,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521
        )
        ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "GITHUB_REPO=$GITHUB_REPO bash -s" << 'EOF'
          set -e  # Остановить выполнение при ошибке

          echo "👤 Current user: $(whoami)"
          echo "📁 Preparing deployment..."

          # Создаем временную директорию для клонирования
          TEMP_DIR="/tmp/fiscal-parser-$(date +%s)"
          FINAL_DIR="/opt/fiscal-parser"

          echo "📂 Cloning repository to temporary directory..."
          git clone "https://github.com/${GITHUB_REPO}.git" "$TEMP_DIR"
          cd "$TEMP_DIR"
          git checkout main

          echo "🛑 Stopping existing services and backing up .env..."
          # Сначала сохраняем .env файл если он существует
          if [ -d "$FINAL_DIR" ] && [ -f "$FINAL_DIR/.env" ]; then
            echo "💾 Backing up existing .env file..."
            cp "$FINAL_DIR/.env" "/tmp/.env.backup"
          fi

          # Останавливаем сервисы (игнорируем ошибки совместимости Docker Compose 1.29.2)
          if [ -d "$FINAL_DIR" ]; then
            cd "$FINAL_DIR"
            docker compose down --remove-orphans 2>/dev/null || true
            cd ..
          fi

          echo "📦 Moving new code to production directory..."
          # Первый деплой: FINAL_DIR могла не существовать — mv в никуда молча ломался (|| true)
          # .env уже в /tmp/.env.backup; каталог пересоздаём целиком
          rm -rf "$FINAL_DIR"
          mkdir -p "$FINAL_DIR"
          cp -a "$TEMP_DIR"/. "$FINAL_DIR"/
          rm -rf "$TEMP_DIR"
          cd "$FINAL_DIR"

          # Восстанавливаем .env файл если он был сохранен
          if [ -f "/tmp/.env.backup" ]; then
            echo "💾 Restoring .env file..."
            mv "/tmp/.env.backup" .env
          else
            echo "⚠️ No .env file found. Creating basic .env from template..."
            # Создаем базовый .env файл из env_example.txt если он существует
            if [ -f "env_example.txt" ]; then
              cp env_example.txt .env
              echo "📄 Created .env file from env_example.txt"
              echo "⚠️ IMPORTANT: Please edit .env file with your actual values!"
            else
              echo "❌ No env_example.txt found. You must create .env file manually."
            fi
          fi

          echo "📦 Building new images..."
          # Игнорируем ошибки совместимости Docker Compose 1.29.2 с Docker API
          docker compose build --no-cache --pull 2>/dev/null || true

          echo "🚀 Starting services (docker compose up -d only)..."
          COMPOSE_UP_LOG="/tmp/docker-compose-up.log"
          if docker compose up -d >"$COMPOSE_UP_LOG" 2>&1; then
            echo "✅ Services started with docker compose"
          else
            echo "❌ docker compose up -d failed (see details below)."
            echo "📄 Full output of docker compose up -d:"
            cat "$COMPOSE_UP_LOG" || true
            echo "📋 docker compose ps -a:"
            docker compose ps -a 2>&1 || true
            echo "📋 docker compose logs (last 200 lines per service):"
            docker compose logs --no-color --tail=200 2>&1 || true
            echo "📋 docker compose config:"
            docker compose config 2>&1 || true
            if [ -f .env ]; then
              echo "📋 .env present; sensitive keys masked:"
              grep -E "^(POSTGRES_|DATABASE_|BOT_TOKEN)" .env | sed 's/=.*/=***/' || true
            else
              echo "⚠️ .env file missing in $FINAL_DIR"
            fi
            echo "🐳 docker version:"
            docker version 2>&1 || true
            exit 1
          fi

          echo "⏳ Waiting for services to start..."
          sleep 10

          echo "📊 Checking service status..."
          echo "🔍 All running containers:"
          docker ps -a
          echo "🔍 Containers with 'fiscal' in name:"
          docker ps --filter "name=fiscal_" -a
          echo "🔍 Checking networks..."
          docker network ls
          echo "🔍 Checking container networks..."
          docker inspect fiscal_postgres --format='{{range .NetworkSettings.Networks}}{{.NetworkID}} {{end}}' 2>/dev/null || echo "PostgreSQL container not found"
          docker inspect fiscal_bot --format='{{range .NetworkSettings.Networks}}{{.NetworkID}} {{end}}' 2>/dev/null || echo "Bot container not found"

          echo "🔍 Checking if containers actually started..."
          if docker ps --filter "name=fiscal_postgres" --format "table {{.Names}}\t{{.Status}}" | grep -q fiscal_postgres; then
            echo "✅ PostgreSQL container is running"
          else
            echo "❌ PostgreSQL container is NOT running"
            echo "🔍 Checking PostgreSQL container logs if it exists..."
            docker logs fiscal_postgres 2>/dev/null || echo "PostgreSQL container does not exist"
          fi

          if docker ps --filter "name=fiscal_bot" --format "table {{.Names}}\t{{.Status}}" | grep -q fiscal_bot; then
            echo "✅ Bot container is running"
          else
            echo "❌ Bot container is NOT running"
            echo "🔍 Checking Bot container logs if it exists..."
            docker logs fiscal_bot 2>/dev/null || echo "Bot container does not exist"
          fi

          echo "🧹 Cleaning up old Docker resources..."
          docker system prune -f --volumes || true

          echo "✅ Deployment completed successfully!"
          echo "🎯 Services running:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" --filter "name=fiscal_"
        EOF

    - name: Notify deployment status
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Deployment to production completed successfully!"
        else
          echo "❌ Deployment failed!"
        fi
